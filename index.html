 const s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(k)+'&callback=initMap&loading=async';s.async=true;document.head.appendChild(s);}
if(HARDCODED_KEY)go();

const RAMPS={
 orig:{stops:[[0,'rgba(43,131,186,0)'],[.15,'rgba(43,131,186,.8)'],[.35,'#abdda4'],[.55,'#ffffbf'],[.78,'#fdae61'],[1,'#d7191c']],css:'linear-gradient(90deg,#2b83ba,#abdda4,#ffffbf,#fdae61,#d7191c)'},
 cool:{stops:[[0,'rgba(0,214,255,0)'],[.15,'rgba(0,214,255,.8)'],[.5,'#1f78e0'],[1,'#1b1464']],css:'linear-gradient(90deg,#00d6ff,#1f78e0,#1b1464)'},
 warm:{stops:[[0,'rgba(255,214,0,0)'],[.15,'rgba(255,214,0,.85)'],[.5,'#ff7a00'],[1,'#a4001f']],css:'linear-gradient(90deg,#ffd600,#ff7a00,#a4001f)'}
};
function mkLUT(stops){const c=document.createElement('canvas');c.width=256;c.height=1;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,256,0);
 stops.forEach(a=>g.addColorStop(a[0],a[1]));x.fillStyle=g;x.fillRect(0,0,256,1);return x.getImageData(0,0,256,1).data;}
Object.values(RAMPS).forEach(r=>r.lut=mkLUT(r.stops));

let view='online';
const $=id=>document.getElementById(id);

function getFilteredStores() {
  const dist = $('dist').value;
  return STORES.filter(s => dist === 'all' || s.dist === dist);
}
function storeVal(s){const m=$('met').value,p=$('per').value;if(!s.s)return p==='all'?(m==='s'?s.st:s.tt):0;const a=s[m];return p==='all'?a.reduce((x,y)=>x+y,0):a[+p];}
const sPos=s=>s.ll?{lat:s.ll[0],lon:s.ll[1]}:(PINXY[s.pin]||null);
const sTot=(s,k)=>s[k]?s[k].reduce((a,b)=>a+b,0):(k==='s'?s.st:s.tt);

function storePoints(){ 
 const agg={};
 getFilteredStores().forEach(s=>{
  const p=sPos(s);if(!p)return;
  const v=storeVal(s);
  const k=s.ll?'ll'+s.ll:s.pin;
  const a=agg[k]||(agg[k]={lat:p.lat,lon:p.lon,q:0});
  a.q+=v;
 });
 return Object.values(agg);
}
const MAXQ=Math.max(...DATA.map(d=>d.q));
function norm(q,scl,mx){if(scl==='sqrt')return Math.sqrt(q/mx);if(scl==='log')return Math.log(1+q)/Math.log(1+mx);return q/mx;}
function unnorm(t,scl,mx){if(scl==='sqrt')return t*t*mx;if(scl==='log')return Math.exp(t*Math.log(1+mx))-1;return t*mx;}
const fmt=v=>Math.abs(v-Math.round(v))<0.05?String(Math.round(v)):v.toFixed(1);

function initMap(){
 $('keybox').style.display='none';$('panel').style.display='block';
 map=new google.maps.Map($('map'),{center:{lat:19.12,lng:72.9},zoom:10,mapTypeControl:true,streetViewControl:false});
 info=new google.maps.InfoWindow();
 const ov=new google.maps.OverlayView();ov.onAdd=function(){};ov.onRemove=function(){};ov.draw=function(){};ov.setMap(map);
 overlayCanvas=document.createElement('canvas');Object.assign(overlayCanvas.style,{position:'absolute',left:0,top:0,pointerEvents:'none',zIndex:1});
 map.getDiv().appendChild(overlayCanvas);
 
 // Populate Distributor filter dropdown
 const dSel = $('dist');
 const dists = Array.from(new Set(STORES.map(s=>s.dist).filter(d=>d))).sort();
 dists.forEach(d=>{
  const opt = document.createElement('option');
  opt.value = d;
  opt.textContent = d;
  dSel.appendChild(opt);
 });

 DATA.forEach(d=>{const m=new google.maps.Marker({position:{lat:d.lat,lng:d.lon},map,title:d.pin,
  icon:{path:google.maps.SymbolPath.CIRCLE,scale:3+Math.sqrt(d.q)*0.9,fillOpacity:0,strokeColor:'#222',strokeWeight:1}});
  m.addListener('click',()=>{info.setContent('<b>'+d.pin+'</b> '+d.name+'<br>Online units: '+d.q);info.open(map,m);});markers.push(m);});
 
 const seen={};
 STORES.forEach(s=>{const p=sPos(s);if(!p)return;const sk=s.ll?'ll'+s.ll:s.pin;const k=seen[sk]=(seen[sk]||0)+1;
  const ang=(k-1)*2.4,rad=k===1?0:0.0035*Math.sqrt(k);
  const m=new google.maps.Marker({position:{lat:p.lat+rad*Math.sin(ang),lng:p.lon+rad*Math.cos(ang)},map,title:s.name,zIndex:50,
   icon:{path:'M-1,-1 L1,-1 L1,1 L-1,1 Z',scale:6,fillOpacity:1,fillColor:'#fff',strokeColor:'#7a0019',strokeWeight:2}});
  m._s=s;
  m.addListener('click',()=>{const sv=sTot(s,'s'),tv=sTot(s,'t');
   info.setContent('<b>'+s.name+'</b><br>'+(s.dist?s.dist+'<br>':'')+(s.pin?'Pincode '+s.pin+(PINXY[s.pin]?' ('+PINXY[s.pin].name+')':'')+' · ':'')+s.area+
    '<br>Secondary: <b>'+fmt(sv)+'</b> · Tertiary: <b>'+fmt(tv)+'</b> (Apr–Oct)'+
    '<br><span style="color:#777;font-size:11px">'+s.status+(s.note?' – '+s.note:'')+'</span>');info.open(map,m);});
  smarkers.push(m);});
  
 BEYOND_STORES.forEach(b=>{
  const m=new google.maps.Marker({position:{lat:b.lat,lng:b.lng},map,title:b.name,zIndex:100,
   icon:{path:google.maps.SymbolPath.CIRCLE,scale:7,fillOpacity:1,fillColor:'#ff007f',strokeColor:'#000',strokeWeight:2}});
  m.addListener('click',()=>{info.setContent('<b>'+b.name+'</b><br>'+(b.address?b.address+'<br>':'')+(b.city?b.city+' · ':'')+'Pincode: '+b.pincode+(b.dist?'<br>'+b.dist+' · O/L '+b.cat+'<br>Secondary: <b>'+fmt(b.sec)+'</b> · Tertiary: <b>'+fmt(b.ter)+'</b> (Apr–Oct)':''));info.open(map,m);});
  beyondMarkers.push(m);
 });

 const draw=()=>render(ov);
 ['bounds_changed','zoom_changed','idle'].forEach(e=>map.addListener(e,draw));
 
 // UI Event Bindings
 $('rad').addEventListener('input', () => { $('rv').textContent=(+$('rad').value).toFixed(2); draw(); });
 ['op','ovl','scl'].forEach(id=>$(id).addEventListener('input', draw));
 ['met','per','dist'].forEach(id=>$(id).addEventListener('input', () => { applyView(); draw(); }));
 $('pts').addEventListener('change', applyMarkers);
 $('sts').addEventListener('change', applyMarkers);
 $('bys').addEventListener('change', () => { applyView(); draw(); });

 document.querySelectorAll('#view button').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.v;
  document.querySelectorAll('#view button').forEach(x=>x.classList.toggle('on',x===b));applyView();draw();}));
 
 const bnd=new google.maps.LatLngBounds();DATA.filter(d=>d.lat>18.85&&d.lat<19.85&&d.lon>72.7&&d.lon<73.3).forEach(d=>bnd.extend({lat:d.lat,lng:d.lon}));map.fitBounds(bnd);
 applyView();
 google.maps.event.addListenerOnce(map,'idle',draw);
}

function applyMarkers(){
 const showO=(view==='online'||view==='both')&&$('pts').checked;
 const showS=(view==='stores'||view==='both')&&$('sts').checked;
 const showB=(view==='beyond') || (view==='both' && $('bys').checked);
 const selDist = $('dist').value;

 markers.forEach(m=>m.setVisible(showO));
 smarkers.forEach(m=>{
  const s = m._s;
  const matchDist = selDist === 'all' || s.dist === selDist;
  const z = storeVal(s) === 0;
  const ic = m.getIcon();
  m.setIcon(Object.assign({},ic,{fillColor:'#a4001f',strokeColor:'#fff'}));
  m.setVisible(showS && matchDist && !z);
 });
 beyondMarkers.forEach(m=>m.setVisible(showB));
}

function applyView(){
 $('storeopts').style.display=(view==='stores'||view==='both')?'block':'none';
 $('dispopts').style.display=view==='beyond'?'none':'block';
 $('ptsl').style.display=(view==='online'||view==='both')?'block':'none';
 $('stsl').style.display=(view==='stores'||view==='both')?'block':'none';
 $('bysl').style.display=(view==='both')?'block':'none';
 $('unpl').style.display='none';
 
 const sp=storePoints(),stot=sp.reduce((a,b)=>a+b.q,0);
 let t='';
 if(view==='online'||view==='both')t+='<span class="sw" style="background:'+(view==='both'?'#1f78e0':'#2b83ba')+'"></span> Online: <b>'+total.toLocaleString()+'</b> units · '+DATA.length+' pincodes<br>';
 if(view==='stores'||view==='both'){
     const fStores = getFilteredStores();
     t+='<span class="sw" style="background:#e8590c"></span> Stores: <b>'+fmt(stot)+'</b> units · '+sp.filter(p=>p.q>0).length+' pincodes with sales · '+fStores.length+' store locations<br>';
 }
 if(view==='beyond'||(view==='both'&&$('bys').checked))t+='<span class="sw" style="background:#9c27b0"></span> Beyond Website: <b>'+BEYOND_STORES.length+'</b> locations';
 $('tot').innerHTML=t;
 applyMarkers();
}

function layer(points,mx,ramp,scl,ovl,rp,proj,w,h,op){
 const off=document.createElement('canvas');off.width=w;off.height=h;const x=off.getContext('2d');
 x.fillStyle='#000';x.fillRect(0,0,w,h);
 x.globalCompositeOperation=ovl==='sum'?'lighter':'lighten';
 points.forEach(d=>{if(!(d.q>0))return;const p=proj.fromLatLngToContainerPixel(new google.maps.LatLng(d.lat,d.lon));if(!p)return;
  const g=Math.round(255*Math.min(1,norm(d.q,scl,mx)));const gr=x.createRadialGradient(p.x,p.y,0,p.x,p.y,rp);
  gr.addColorStop(0,'rgb('+g+','+g+','+g+')');gr.addColorStop(1,'rgba('+g+','+g+','+g+',0)');
  x.fillStyle=gr;x.beginPath();x.arc(p.x,p.y,rp,0,6.2832);x.fill();});
 const img=x.getImageData(0,0,w,h),px=img.data,L=ramp.lut;
 for(let i=0;i<px.length;i+=4){const j=px[i]*4;px[i]=L[j];px[i+1]=L[j+1];px[i+2]=L[j+2];px[i+3]=L[j+3]*op;}
 x.globalCompositeOperation='source-over';x.putImageData(img,0,0);return off;
}

function render(ov){
 const proj=ov.getProjection();if(!proj)return;
 const div=map.getDiv(),w=div.clientWidth,h=div.clientHeight;
 overlayCanvas.width=w;overlayCanvas.height=h;
 const r=$('rad').value*1000,op=+$('op').value,ovl=$('ovl').value,scl=$('scl').value;
 const mpp=156543.03392*Math.cos(19.1*Math.PI/180)/Math.pow(2,map.getZoom());const rp=Math.max(6,r/mpp);
 const ctx=overlayCanvas.getContext('2d');
 const sp=storePoints(),smax=Math.max(1,...sp.map(p=>p.q));
 const oRamp=view==='both'?RAMPS.cool:RAMPS.orig;
 if(view==='online'||view==='both')ctx.drawImage(layer(DATA,MAXQ,oRamp,scl,ovl,rp,proj,w,h,op),0,0);
 if(view==='stores'||view==='both')ctx.drawImage(layer(sp,smax,RAMPS.warm,scl,ovl,rp,proj,w,h,op),0,0);
 applyMarkers();
 updateLegend(ovl,scl,oRamp,smax);
}

function legBlock(title,sw,ramp,mx,scl,extra){
 return '<h2><span class="sw" style="background:'+sw+'"></span>'+title+'</h2><div class="legend" style="background:'+ramp.css+'"></div><div class="lg">'+
  [0,.25,.5,.75,1].map(t=>'<span>'+fmt(unnorm(t,scl,mx))+'</span>').join('')+'</div>'+(extra?'<div class="note">'+extra+'</div>':'');
}

function updateLegend(ovl,scl,oRamp,smax){
 let h='';
 if(view==='online'||view==='both')h+=legBlock('Online sales (units)',oRamp===RAMPS.cool?'#1f78e0':'#2b83ba',oRamp,MAXQ,scl,'Colour at each pincode = its own units (max '+MAXQ+').');
 if(view==='stores'||view==='both')h+=legBlock('Store sales (units)','#e8590c',RAMPS.warm,smax,scl,'Stores shown at their own location (max '+fmt(smax)+'). Stores with no sales are not shown.');
 if(view==='beyond' || (view==='both' && $('bys').checked))h+='<h2><span class="sw" style="background:#ff007f"></span>Beyond Website Locations</h2><div class="note">These locations are not part of the heatmap data.</div>';
 if(view!=='beyond')h+='<div class="note">'+(ovl==='sum'?'Stacked mode: colour = combined density of nearby pincodes, so it can exceed a single pincode. Labels show the single-pincode scale.':'')+(scl==='linear'?'':' Non-linear scale: label spacing is not equal in units.')+(view==='both'?' Online and stores each use their own scale.':'')+'</div>';
 $('legends').innerHTML=h;
}
</script></body></html>
